security:
- hmac: []
tags:
- name: '#X Amz Target=SWBExternalService.ListInstances'
paths:
  /#X-Amz-Target=SWBExternalService.ListInstances:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: ListInstances
      description: Lists the IAM Identity Center instances that the caller has access to.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListInstancesResponse'
        '480':
          description: InternalServerException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerException'
        '481':
          description: ThrottlingException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottlingException'
        '482':
          description: AccessDeniedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedException'
        '483':
          description: ValidationException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationException'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListInstancesRequest'
      parameters:
      - name: MaxResults
        in: query
        schema:
          type: string
        description: Pagination limit
        required: false
      - name: NextToken
        in: query
        schema:
          type: string
        description: Pagination token
        required: false
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - SWBExternalService.ListInstances
      summary: Amazon IAM Identity Center List Instances
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#X Amz Target=SWBExternalService.ListInstances'
components:
  parameters:
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
  schemas:
    ValidationException: {}
    Id:
      type: string
      pattern: ^[a-zA-Z0-9-]*
      minLength: 1
      maxLength: 64
    MaxResults:
      type: integer
      minimum: 1
      maximum: 100
    ListInstancesRequest:
      type: object
      title: ListInstancesRequest
      properties:
        MaxResults:
          allOf:
          - $ref: '#/components/schemas/MaxResults'
          - description: The maximum number of results to display for the instance.
        NextToken:
          allOf:
          - $ref: '#/components/schemas/Token'
          - description: The pagination token for the list API. Initially the value is null. Use the output of previous API calls to make subsequent calls.
    ThrottlingException: {}
    InstanceList:
      type: array
      items:
        $ref: '#/components/schemas/InstanceMetadata'
    InstanceMetadata:
      type: object
      properties:
        InstanceArn:
          allOf:
          - $ref: '#/components/schemas/InstanceArn'
          - description: The ARN of the IAM Identity Center instance under which the operation will be executed. For more information about ARNs, see <a href="/general/latest/gr/aws-arns-and-namespaces.html">Amazon Resource Names (ARNs) and AWS Service Namespaces</a> in the <i>AWS General Reference</i>.
        IdentityStoreId:
          allOf:
          - $ref: '#/components/schemas/Id'
          - description: The identifier of the identity store that is connected to the IAM Identity Center instance.
      description: Provides information about the IAM Identity Center instance.
    InstanceArn:
      type: string
      pattern: arn:(aws|aws-us-gov|aws-cn|aws-iso|aws-iso-b):sso:::instance/(sso)?ins-[a-zA-Z0-9-.]{16}
      minLength: 10
      maxLength: 1224
    Token:
      type: string
      pattern: ^[-a-zA-Z0-9+=/_]*
      maxLength: 2048
    ListInstancesResponse:
      type: object
      properties:
        Instances:
          allOf:
          - $ref: '#/components/schemas/InstanceList'
          - description: Lists the IAM Identity Center instances that the caller has access to.
        NextToken:
          allOf:
          - $ref: '#/components/schemas/Token'
          - description: The pagination token for the list API. Initially the value is null. Use the output of previous API calls to make subsequent calls.
    AccessDeniedException: {}
    InternalServerException: {}
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
